<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sushma Somashekar · Garden sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --ink: #3b2a3a; --blush: #f6c1c9; --peach: #ffd2a8; --rose: #e57f9b; --lav: #b9a2d8; --sun: #fff1c9; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #2a2040; color: var(--ink); font-family: Inter, system-ui, sans-serif; }
  .journey { height: 320vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .layer { position: absolute; inset: 0; will-change: transform; }
  #sky { background: linear-gradient(180deg, var(--sky1, #9fb4e6) 0%, var(--sky2, #f7c6d0) 52%, var(--sky3, #ffd9b0) 72%); }
  #sun { position: absolute; left: 22%; width: 18vmin; height: 18vmin; border-radius: 50%;
    background: radial-gradient(circle, #fffaf0 0 32%, rgba(255,236,190,.85) 46%, rgba(255,200,160,0) 70%);
    filter: blur(1px); }
  #glow { background: radial-gradient(60% 40% at 25% 64%, rgba(255,222,180,.75), rgba(255,200,180,0) 70%); }
  .cloud { position: absolute; border-radius: 50%; background: rgba(255,232,236,.55); filter: blur(18px); }
  svg { position: absolute; left: 0; width: 100%; }
  .mist { background: linear-gradient(180deg, rgba(255,240,240,0) 46%, rgba(255,236,236,.7) 62%, rgba(255,236,236,0) 78%); }
  .intro { position: absolute; inset: 0 0 auto; top: 13vh; display: grid; justify-items: center; text-align: center; padding: 0 16px; z-index: 5; pointer-events: none; }
  .intro p.tag { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: #5a3f58; opacity: .8; margin-bottom: 18px; }
  .intro h1 { font-family: 'Cormorant Garamond', serif; font-weight: 400; font-size: clamp(44px, 9vw, 112px); line-height: .95; color: #3a2440; }
  .intro h1 em { color: #b5476d; }
  .intro .line { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: clamp(18px, 2.4vw, 26px); margin-top: 18px; color: #4d3550; }
  .hint { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: #fff; opacity: .85; z-index: 6; }
  .skip { position: fixed; top: 18px; right: 18px; z-index: 9; font-size: 13px; color: #3a2440; background: rgba(255,248,246,.7); backdrop-filter: blur(8px); padding: 9px 16px; border-radius: 99px; text-decoration: none; }
  .petal { position: absolute; width: 10px; height: 7px; border-radius: 70% 0 70% 0; background: #f4a9bb; opacity: .85; }
  .bfly { position: absolute; width: 34px; height: 26px; z-index: 4; }
  .bfly i { position: absolute; top: 0; width: 17px; height: 24px; background: radial-gradient(circle at 40% 40%, #ffc58a, #e8742f 60%, #5b2d1c 100%); border-radius: 60% 60% 40% 40%; animation: flap .32s ease-in-out infinite alternate; }
  .bfly i:first-child { left: 0; transform-origin: right center; }
  .bfly i:last-child { right: 0; transform-origin: left center; }
  @keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.25); } }
  .gate { position: absolute; bottom: -2vh; left: 50%; width: min(46vw, 440px, 52vh); transform: translateX(-50%); z-index: 3; perspective: 900px; }
  #gl, #gr { transform-box: view-box; }
  .next { height: 100vh; display: grid; place-content: center; text-align: center; color: #fff4ee; background: linear-gradient(#5d4a7a, #2a2040); font-family: 'Cormorant Garamond', serif; font-size: 28px; padding: 0 16px; }
  @media (prefers-reduced-motion: reduce) { .bfly i { animation: none; } }
</style>
</head>
<body>
<a class="skip" href="#next">Skip to projects</a>
<section class="journey" id="journey">
  <div class="stage">
    <div class="layer" id="sky"></div>
    <div class="layer" data-d="0.05"><div id="sun"></div></div>
    <div class="layer" id="glow"></div>
    <div class="layer" data-d="0.08" id="clouds"></div>
    <!-- far mountains -->
    <svg class="layer" data-d="0.12" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" style="height:100%">
      <path d="M0 560 L160 470 L260 510 L420 420 L560 500 L700 440 L860 520 L1010 430 L1160 495 L1300 450 L1440 500 V900 H0Z" fill="#b8a3c8" opacity=".75"/>
      <path d="M380 440 L420 420 L460 438Z M980 446 L1010 430 L1040 444Z" fill="#fff" opacity=".7"/>
    </svg>
    <div class="layer mist"></div>
    <!-- hills + cottage -->
    <svg class="layer" data-d="0.22" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" style="height:100%">
      <path d="M0 640 C220 560 420 600 620 610 C860 622 1060 560 1440 600 V900 H0Z" fill="#9db08f"/>
      <g transform="translate(170 548)">
        <rect x="0" y="24" width="96" height="52" fill="#f3e3d6"/><path d="M-8 28 L48 -6 L104 28Z" fill="#7a5b6c"/>
        <rect x="18" y="40" width="14" height="16" fill="#ffd98a"/><rect x="62" y="40" width="14" height="16" fill="#ffd98a"/>
      </g>
      <g fill="#7f9878"><ellipse cx="320" cy="575" rx="34" ry="46"/><ellipse cx="1180" cy="580" rx="40" ry="52"/><ellipse cx="1240" cy="590" rx="28" ry="38"/></g>
    </svg>
    <!-- tulip rows (built by JS) -->
    <svg class="layer" data-d="0.4" id="t1" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" style="height:100%"></svg>
    <div class="layer" data-d="0.4" id="flies"></div>
    <!-- gate -->
    <svg class="gate" id="gate" viewBox="0 0 600 520" aria-hidden="true">
      <g fill="none" stroke="#2f2433" stroke-width="5">
        <g id="gl"><rect x="80" y="120" width="220" height="400"/><path d="M80 120 Q190 40 300 120"/><path d="M110 120 V520 M140 110 V520 M170 100 V520 M200 96 V520 M230 100 V520 M260 108 V520"/><circle cx="190" cy="300" r="34"/></g>
        <g id="gr"><rect x="300" y="120" width="220" height="400"/><path d="M300 120 Q410 40 520 120"/><path d="M340 108 V520 M370 100 V520 M400 96 V520 M430 100 V520 M460 110 V520 M490 120 V520"/><circle cx="410" cy="300" r="34"/></g>
      </g>
      <rect x="40" y="60" width="40" height="460" fill="#cdbfb6"/><rect x="520" y="60" width="40" height="460" fill="#cdbfb6"/>
      <circle cx="60" cy="40" r="20" fill="#ffe3a6"/><circle cx="540" cy="40" r="20" fill="#ffe3a6"/>
    </svg>
    <svg class="layer" data-d="0.75" id="t2" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" style="height:100%;z-index:4"></svg>
    <div class="layer" id="petals" style="z-index:4"></div>
    <div class="intro" id="intro">
      <p class="tag">Designer · Brand storyteller · Growth strategist</p>
      <h1>Sushma <em>Somashekar</em></h1>
      <p class="line">I turn brands into stories people remember.</p>
    </div>
    <p class="hint" id="hint">Scroll to open the gate ↓</p>
  </div>
</section>
<section class="next" id="next">The garden path continues here: butterflies, the lake, then the house.</section>
<script>
(() => {
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, NS = 'http://www.w3.org/2000/svg';
  const rnd = (a, b) => a + Math.random() * (b - a);
  const COLS = ['#f4a3b8', '#ee8aa6', '#f7b9c6', '#e5768f', '#fbd0d6', '#ffe2e6'];
  function tulips(svg, n, y0, y1, s0, s1) {
    const items = [];
    for (let i = 0; i < n; i++) items.push({ x: rnd(-20, 1460), y: rnd(y0, y1) });
    items.sort((a, b) => a.y - b.y);
    for (const t of items) {
      const k = s0 + (s1 - s0) * (t.y - y0) / (y1 - y0), c = COLS[(Math.random() * COLS.length) | 0];
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('transform', `translate(${t.x} ${t.y}) scale(${k})`);
      g.innerHTML = `<path d="M0 0 V60" stroke="#5f8a5a" stroke-width="2.4"/>
        <path d="M0 50 C-14 40 -18 24 -16 12 C-8 22 -2 34 0 46Z" fill="#6f9a66"/>
        <path d="M-10 -2 C-12 -16 -6 -26 0 -28 C6 -26 12 -16 10 -2 C6 4 -6 4 -10 -2Z" fill="${c}"/>
        <path d="M-4 -26 C0 -18 0 -8 0 2" stroke="rgba(255,255,255,.35)" stroke-width="1.6" fill="none"/>`;
      svg.appendChild(g);
    }
  }
  tulips(document.getElementById('t1'), 170, 640, 780, .45, .9);
  tulips(document.getElementById('t2'), 60, 790, 930, 1.3, 2.4);
  const clouds = document.getElementById('clouds');
  for (let i = 0; i < 6; i++) { const d = document.createElement('div'); d.className = 'cloud'; Object.assign(d.style, { left: rnd(-5, 85) + '%', top: rnd(6, 34) + '%', width: rnd(160, 340) + 'px', height: rnd(40, 80) + 'px' }); clouds.appendChild(d); }
  const flies = document.getElementById('flies'), bf = [];
  for (let i = 0; i < 5; i++) { const b = document.createElement('div'); b.className = 'bfly'; b.innerHTML = '<i></i><i></i>'; flies.appendChild(b); bf.push({ el: b, x: rnd(10, 90), y: rnd(55, 75), p: rnd(0, 6) }); }
  const pet = document.getElementById('petals'), ps = [];
  for (let i = 0; i < 18; i++) { const p = document.createElement('i'); p.className = 'petal'; pet.appendChild(p); ps.push({ el: p, x: rnd(0, 100), y: rnd(-10, 100), v: rnd(.03, .08), r: rnd(0, 360) }); }
  const layers = [...document.querySelectorAll('[data-d]')], sky = document.getElementById('sky'), sun = document.getElementById('sun');
  const gl = document.getElementById('gl'), gr = document.getElementById('gr'), intro = document.getElementById('intro'), hint = document.getElementById('hint');
  const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
  const S1 = [[159, 180, 230], [247, 198, 208], [255, 217, 176]], S2 = [[120, 120, 190], [243, 160, 170], [255, 190, 140]];
  function frame(t) {
    const j = document.getElementById('journey'), max = j.offsetHeight - innerHeight;
    const p = Math.min(1, Math.max(0, scrollY / max));
    layers.forEach(l => l.style.transform = `translateY(${p * l.dataset.d * 260}px) scale(${1 + p * l.dataset.d * .5})`);
    sun.style.top = (40 + p * 10) + '%';
    ['--sky1', '--sky2', '--sky3'].forEach((v, i) => sky.style.setProperty(v, `rgb(${mix(S1[i], S2[i], p)})`));
    const g = Math.min(1, p * 1.8);
    gl.style.transform = `scaleX(${1 - g * .8})`; gr.style.transform = `scaleX(${1 - g * .8})`;
    gl.style.transformOrigin = '80px 300px'; gr.style.transformOrigin = '520px 300px';
    document.getElementById('gate').style.opacity = 1 - Math.max(0, (p - .45) * 3);
    intro.style.opacity = 1 - p * 3; intro.style.transform = `translateY(${-p * 120}px)`; hint.style.opacity = .85 - p * 4;
    if (!RM) {
      bf.forEach(b => { const tt = t / 1000 + b.p; b.el.style.transform = `translate(${b.x * innerWidth / 100 + Math.sin(tt * .7) * 60}px, ${b.y * innerHeight / 100 + Math.sin(tt * 1.3) * 24 - p * 300}px) rotate(${Math.sin(tt) * 14}deg)`; });
      ps.forEach(q => { q.y += q.v; q.x += Math.sin((t / 1000) + q.r) * .02; if (q.y > 105) q.y = -5; q.el.style.transform = `translate(${q.x * innerWidth / 100}px, ${q.y * innerHeight / 100}px) rotate(${q.r + t / 20}deg)`; });
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
